<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LUT POS v1.0.0 - Sistema de Ponto de Venda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LUT POS">

    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
    <link rel="shortcut icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- PWA para iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        /* ========== LOADING PERSONALIZADO PARA APK ========== */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader-box {
            text-align: center;
            padding: 20px;
            border-radius: 20px;
        }

        .loader-icon {
            font-size: 64px;
            color: #3b82f6;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loader-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .loader-subtitle {
            color: #9ca3af;
            font-size: 14px;
        }

        .loader-progress {
            width: 200px;
            height: 4px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 4px;
            margin: 20px auto 0;
            overflow: hidden;
        }

        .loader-progress-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        * {
            transition: all 0.2s ease;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .toast {
            animation: slideInRight 0.3s ease;
            z-index: 9999;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            animation: fadeIn 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @media print {
            .no-print {
                display: none;
            }
        }

        .quantity-btn {
            cursor: pointer;
        }

        .quantity-btn:hover {
            transform: scale(1.05);
        }

        input,
        select,
        button {
            font-size: 16px;
        }

        .btn-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            background-color: #2563eb;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-top:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background-color: #1f2937;
            z-index: 1001;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .mobile-menu.open {
            right: 0;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .menu-overlay.open {
            display: block;
        }

        @media (min-width: 768px) {

            .mobile-menu,
            .menu-overlay,
            .menu-toggle-btn {
                display: none !important;
            }
        }

        .menu-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            left: auto;
            z-index: 1002;
            background-color: #1f2937;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .menu-toggle-btn i {
            color: white !important;
        }

        .close-menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background-color: #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-menu-btn i {
            color: white !important;
        }

        .close-menu-btn:hover {
            background-color: #dc2626;
        }

        .nav-btn-mobile {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            width: 100% !important;
            padding: 12px 16px !important;
            margin: 4px 0 !important;
            border-radius: 8px !important;
            transition: background 0.2s !important;
            cursor: pointer !important;
            background-color: transparent !important;
            color: white !important;
        }

        .nav-btn-mobile:hover {
            background-color: #374151 !important;
        }

        .nav-btn-mobile i {
            width: 24px !important;
            font-size: 20px !important;
            flex-shrink: 0 !important;
            color: white !important;
        }

        .nav-btn-mobile span {
            display: inline-block !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            color: white !important;
            flex-shrink: 0 !important;
        }

        @media (min-width: 768px) {
            .desktop-sidebar {
                position: fixed;
                left: 0;
                top: 0;
                width: 280px;
                height: 100%;
                background-color: #1f2937;
                z-index: 10;
                overflow-y: auto;
            }

            .main-content {
                margin-left: 280px;
            }
        }

        @media (max-width: 767px) {
            .desktop-sidebar {
                display: none !important;
            }

            .main-content {
                margin-left: 0 !important;
            }
        }

        .nav-btn {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            width: 100% !important;
            padding: 10px 16px !important;
            margin: 4px 0 !important;
            border-radius: 8px !important;
            transition: background 0.2s !important;
            cursor: pointer !important;
            color: white !important;
        }

        .nav-btn:hover {
            background-color: #374151 !important;
        }

        .nav-btn i {
            width: 24px;
            font-size: 18px;
            color: white !important;
        }

        .nav-btn span {
            color: white !important;
        }

        .desktop-sidebar .text-white,
        .mobile-menu .text-white,
        .desktop-sidebar .font-bold,
        .mobile-menu .font-bold {
            color: white !important;
        }

        .desktop-sidebar .text-sm,
        .mobile-menu .text-sm,
        .desktop-sidebar .text-xs,
        .mobile-menu .text-xs {
            color: #e5e7eb !important;
        }

        .desktop-sidebar .fa-cash-register,
        .mobile-menu .fa-cash-register {
            color: white !important;
        }

        .desktop-sidebar i,
        .mobile-menu i {
            color: white !important;
        }

        /* ========== BARRA DE ROLAGEM ========== */

        /* Forçar altura e barra nos PRODUTOS */
        #prodGrid {
            max-height: 360px !important;
            overflow-y: auto !important;
        }

        /* Forçar altura e barra nas VENDAS */
        #listaVendasContainer {
            max-height: 200px !important;
            overflow-y: auto !important;
        }

        /* BARRA PERSONALIZADA - APENAS NO CARRINHO */
        #cartItems::-webkit-scrollbar {
            width: 8px !important;
        }

        #cartItems::-webkit-scrollbar-track {
            background: #e5e7eb !important;
            border-radius: 10px !important;
        }

        #cartItems::-webkit-scrollbar-thumb {
            background: #3b82f6 !important;
            border-radius: 10px !important;
        }

        #cartItems::-webkit-scrollbar-thumb:hover {
            background: #1d4ed8 !important;
        }

        /* BARRA PERSONALIZADA - PRODUTOS */
        #prodGrid::-webkit-scrollbar {
            width: 8px !important;
        }

        #prodGrid::-webkit-scrollbar-track {
            background: #e5e7eb !important;
            border-radius: 10px !important;
        }

        #prodGrid::-webkit-scrollbar-thumb {
            background: #3b82f6 !important;
            border-radius: 10px !important;
        }

        #prodGrid::-webkit-scrollbar-thumb:hover {
            background: #1d4ed8 !important;
        }

        /* BARRA PERSONALIZADA - VENDAS */
        #listaVendasContainer::-webkit-scrollbar {
            width: 8px !important;
        }

        #listaVendasContainer::-webkit-scrollbar-track {
            background: #e5e7eb !important;
            border-radius: 10px !important;
        }

        #listaVendasContainer::-webkit-scrollbar-thumb {
            background: #3b82f6 !important;
            border-radius: 10px !important;
        }

        #listaVendasContainer::-webkit-scrollbar-thumb:hover {
            background: #1d4ed8 !important;
        }

        /* Garantir que o carrinho tenha altura e rolagem */
        #cartItems {
            flex: 1 !important;
            max-height: 120px !important;
            overflow-y: auto !important;
            margin-bottom: 16px !important;
        }

        /* ========== ESCONDER BARRA DE ROLAGEM ========== */
        /* Esconder barra de rolagem no Android WebView */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- LOADING PERSONALIZADO -->
    <div id="loader">
        <div class="loader-box">
            <div class="loader-icon">
                <i class="fas fa-cash-register"></i>
            </div>
            <div class="loader-spinner"></div>
            <div class="loader-title">LUT POS</div>
            <div class="loader-subtitle">Sistema de Ponto de Venda</div>
            <div class="loader-progress">
                <div class="loader-progress-bar"></div>
            </div>
        </div>
    </div>
    <div id="app"></div>

    <script>
        // ===================== PERSISTÊNCIA DE SESSÃO =====================
        function saveSession() {
            if (currentUser && currentLoja) {
                const session = {
                    user: currentUser,
                    loja: currentLoja
                };
                localStorage.setItem('lut_pos_session', JSON.stringify(session));
            }
        }

        function loadSession() {
            const saved = localStorage.getItem('lut_pos_session');
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    currentUser = session.user;
                    currentLoja = session.loja;
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }

        function clearSession() {
            localStorage.removeItem('lut_pos_session');
        }

        // ===================== VARIÁVEIS GLOBAIS =====================
        let db = null;
        let currentUser = null;
        let currentLoja = null;
        let currentCart = [];
        let pendingLojaId = null;
        let mobileMenuOpen = false;

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const overlay = document.getElementById('menuOverlay');
            const toggleBtn = document.getElementById('menuToggleBtn');
            mobileMenuOpen = !mobileMenuOpen;
            if (mobileMenuOpen) {
                menu.classList.add('open');
                overlay.classList.add('open');
                if (toggleBtn) toggleBtn.style.display = 'none';
                document.body.style.overflow = 'hidden';
            } else {
                menu.classList.remove('open');
                overlay.classList.remove('open');
                if (toggleBtn) toggleBtn.style.display = 'flex';
                document.body.style.overflow = '';
            }
        }

        function closeMobileMenu() {
            if (mobileMenuOpen) toggleMobileMenu();
        }

        // ===================== FUNÇÕES TOAST E MODAL =====================
        function showToast(message, type = 'success') {
            let toastContainer = document.getElementById('toast-container');
            if (!toastContainer) {
                const container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2';
                document.body.appendChild(container);
                toastContainer = container;
            }
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                warning: 'bg-yellow-600',
                info: 'bg-blue-600'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 mb-2 text-sm`;
            toast.innerHTML = `<i class="fas ${icons[type]} text-base"></i><span class="font-medium">${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function showModal(title, content, onConfirm, confirmText = 'Confirmar', onCancel = null, isDanger = false) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4';

            const confirmButtonClass = isDanger
                ? 'bg-red-600 hover:bg-red-700'
                : 'bg-blue-600 hover:bg-blue-700';

            modalDiv.innerHTML = `
        <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">${title}</h3>
                <button class="close-modal text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="mb-6 text-gray-600 max-h-96 overflow-auto">${content}</div>
            <div class="flex gap-3 justify-end">
                <button class="cancel-modal px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">Cancelar</button>
                <button class="confirm-modal px-4 py-2 ${confirmButtonClass} text-white rounded-lg">${confirmText}</button>
            </div>
        </div>
    `;
            document.body.appendChild(modalDiv);
            const close = () => modalDiv.remove();
            modalDiv.querySelector('.close-modal').onclick = close;
            modalDiv.querySelector('.cancel-modal').onclick = () => {
                if (onCancel) onCancel();
                close();
            };
            modalDiv.querySelector('.confirm-modal').onclick = async () => {
                if (onConfirm) await onConfirm();
                close();
            };
        }

        function showAlert(message, type = 'info') {
            const icons = {
                error: 'fa-circle-exclamation',
                success: 'fa-circle-check',
                info: 'fa-circle-info',
                warning: 'fa-exclamation-triangle'
            };
            const colors = {
                error: 'text-red-600',
                success: 'text-green-600',
                info: 'text-blue-600',
                warning: 'text-yellow-600'
            };
            const modalDiv = document.createElement('div');
            modalDiv.className = 'fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4';
            modalDiv.innerHTML = `
                <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center">
                    <i class="fas ${icons[type]} ${colors[type]} text-5xl mb-4"></i>
                    <p class="text-gray-700 mb-6">${message}</p>
                    <button class="ok-modal px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 w-full">OK</button>
                </div>
            `;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('.ok-modal').onclick = () => modalDiv.remove();
        }

        function addBackToTopButton() {
            if (document.getElementById('backToTopBtn')) return;
            const btn = document.createElement('div');
            btn.id = 'backToTopBtn';
            btn.className = 'btn-top';
            btn.innerHTML = '<i class="fas fa-arrow-up"></i>';
            btn.onclick = () => window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            document.body.appendChild(btn);
            window.addEventListener('scroll', () => btn.style.display = window.scrollY > 300 ? 'flex' : 'none');
            btn.style.display = 'none';
        }

        // ===================== PERSISTÊNCIA =====================
        function saveToLocalStorage() {
            if (!db) return;
            localStorage.setItem('lut_pos_database', JSON.stringify(Array.from(db.export())));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('lut_pos_database');
            return saved ? new Uint8Array(JSON.parse(saved)) : null;
        }

        // ===================== INICIALIZAR BANCO =====================
        async function initDatabase() {
            const SQL = await initSqlJs({
                locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.wasm`
            });
            const saved = loadFromLocalStorage();
            db = saved ? new SQL.Database(saved) : new SQL.Database();

            window.db = db;

            db.run(`CREATE TABLE IF NOT EXISTS loja (id INTEGER PRIMARY KEY AUTOINCREMENT, nome TEXT, endereco TEXT, contacto TEXT)`);
            db.run(`CREATE TABLE IF NOT EXISTS utilizadores (id INTEGER PRIMARY KEY AUTOINCREMENT, loja_id INTEGER, nome TEXT, username TEXT UNIQUE, password TEXT, perfil TEXT)`);
            db.run(`CREATE TABLE IF NOT EXISTS produtos (id INTEGER PRIMARY KEY AUTOINCREMENT, codigo_barras TEXT, nome TEXT, preco REAL, iva INTEGER, stock INTEGER)`);
            db.run(`CREATE TABLE IF NOT EXISTS vendas (id INTEGER PRIMARY KEY AUTOINCREMENT, utilizador_id INTEGER, total REAL, valor_pago REAL, troco REAL, data TEXT)`);
            db.run(`CREATE TABLE IF NOT EXISTS itens_venda (id INTEGER PRIMARY KEY AUTOINCREMENT, venda_id INTEGER, produto_id INTEGER, quantidade INTEGER, preco_unitario REAL, iva INTEGER)`);
            db.run(`CREATE TABLE IF NOT EXISTS assinatura (id INTEGER PRIMARY KEY AUTOINCREMENT, loja_id INTEGER, inicio_trial TEXT, fim_trial TEXT, ativo INTEGER, pagamento_mensal INTEGER, inicio_pagamento TEXT, fim_pagamento TEXT)`);
            try {
                db.run("ALTER TABLE vendas ADD COLUMN metodo TEXT");
            } catch (e) { }
            saveToLocalStorage();
            return db;
        }

        async function runQuery(query, params = []) {
            const result = db.run(query, params);
            saveToLocalStorage();
            return result;
        }

        function getQuery(query, params = []) {
            return db.exec(query, params);
        }

        // ===================== FUNÇÃO DE HASH PARA SENHAS =====================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ===================== FUNÇÃO PARA EDITAR LOJA =====================
        function editarLoja() {
            showModal('Editar Dados da Loja', `
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Nome da Loja</label><input type="text" id="editNomeLoja" value="${currentLoja.nome}" class="w-full p-2 border rounded"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Endereço</label><input type="text" id="editEnderecoLoja" value="${currentLoja.endereco}" class="w-full p-2 border rounded"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Contacto</label><input type="text" id="editContactoLoja" value="${currentLoja.contacto}" class="w-full p-2 border rounded"></div>
                </div>
            `, async () => {
                const novoNome = document.getElementById('editNomeLoja').value;
                const novoEndereco = document.getElementById('editEnderecoLoja').value;
                const novoContacto = document.getElementById('editContactoLoja').value;
                if (!novoNome || !novoEndereco || !novoContacto) {
                    showAlert('Preencha todos os campos!', 'error');
                    return;
                }
                await runQuery("UPDATE loja SET nome=?, endereco=?, contacto=? WHERE id=?", [novoNome, novoEndereco, novoContacto, currentLoja.id]);
                currentLoja = {
                    ...currentLoja,
                    nome: novoNome,
                    endereco: novoEndereco,
                    contacto: novoContacto
                };
                showToast('Dados da loja atualizados com sucesso!');
                renderDashboard();
            }, 'Salvar');
        }

        // ===================== MODAIS CADASTRO =====================
        function showModalCadastrarLoja() {
            showModal('Cadastrar Loja', `
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Nome da Loja *</label><input type="text" id="modalNomeLoja" class="w-full p-2 border rounded" placeholder="Ex: LUT Supermercado"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Endereco *</label><input type="text" id="modalEnderecoLoja" class="w-full p-2 border rounded" placeholder="Ex: Av. Marginal, 123"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Contacto *</label><input type="text" id="modalContactoLoja" class="w-full p-2 border rounded" placeholder="Ex: 84 123 4567"></div>
                </div>
            `, async () => {
                const nome = document.getElementById('modalNomeLoja')?.value;
                const endereco = document.getElementById('modalEnderecoLoja')?.value;
                const contacto = document.getElementById('modalContactoLoja')?.value;
                if (!nome || !endereco || !contacto) return showAlert('Preencha todos os campos!', 'error');
                await runQuery("INSERT INTO loja (nome, endereco, contacto) VALUES (?,?,?)", [nome, endereco, contacto]);
                const result = getQuery("SELECT last_insert_rowid()");
                if (result && result[0] && result[0].values && result[0].values[0]) {
                    pendingLojaId = result[0].values[0][0];
                } else {

        function calcularPrecoComIva(preco, iva) {
            return preco * (1 + iva / 100);

        async function finalizarVenda(valorPago, metodo) {
            if (!currentCart.length) return showAlert('Carrinho vazio', 'error');

            const total = currentCart.reduce((s, i) => s + calcularPrecoComIva(i.preco, i.iva) * i.quantidade, 0);

            let valorPagoFinal = valorPago;
            if (metodo !== 'dinheiro') {
                valorPagoFinal = total;
            }

            if (metodo === 'dinheiro' && valorPago < total) {
                showAlert(`Valor insuficiente. Total: ${total.toFixed(2)} MT`, 'error');
                return;
            }

            const troco = metodo === 'dinheiro' ? valorPago - total : 0;

            // Inserir venda
            await runQuery("INSERT INTO vendas (utilizador_id, total, valor_pago, troco, data, metodo) VALUES (?,?,?,?,?,?)",
                [currentUser.id, total, valorPagoFinal, troco, new Date().toISOString(), metodo]);

            // Pegar o ID da última venda inserida
            const ultimaVenda = db.exec("SELECT id FROM vendas ORDER BY id DESC LIMIT 1");
            let vendaId = 0;

            if (ultimaVenda && ultimaVenda[0] && ultimaVenda[0].values && ultimaVenda[0].values.length > 0) {
                vendaId = ultimaVenda[0].values[0][0];
            }

            console.log("ID da venda:", vendaId);

            // Inserir itens
            for (let i = 0; i < currentCart.length; i++) {
                const item = currentCart[i];
                await runQuery("INSERT INTO itens_venda (venda_id, produto_id, quantidade, preco_unitario, iva) VALUES (?,?,?,?,?)",
                    [vendaId, item.id, item.quantidade, item.preco, item.iva]);
                await runQuery("UPDATE produtos SET stock = stock - ? WHERE id = ?", [item.quantidade, item.id]);
            }

            showToast(`Venda finalizada! ${troco > 0 ? `Troco: ${troco.toFixed(2)} MT` : ''}`);

            gerarRecibo(vendaId, total, valorPagoFinal, troco, metodo);

            currentCart = [];
            renderCart();
        }

        // ===================== DASHBOARD CONTENT (SÓ ADMIN) =====================
        function renderDashboardContent() {
            if (currentUser.perfil !== 'admin') {
                renderPOS();
                return;
            }

            function formatarNumero(numero) {
                if (numero >= 1000000) {
                    return (numero / 1000000).toFixed(1) + 'M';
                }
                if (numero >= 1000) {
                    return (numero / 1000).toFixed(1) + 'K';
                }
                return numero.toFixed(0);
            }

            const totalProdutos = getProdutos().length;
            const vendasCountResult = getQuery(`SELECT COUNT(*) FROM vendas v JOIN utilizadores u ON v.utilizador_id = u.id WHERE u.loja_id = ?`, [currentLoja.id]);
            const vendasCount = vendasCountResult.length && vendasCountResult[0].values.length ? vendasCountResult[0].values[0][0] : 0;
            const vendasTotalResult = getQuery(`SELECT SUM(v.total) FROM vendas v JOIN utilizadores u ON v.utilizador_id = u.id WHERE u.loja_id = ?`, [currentLoja.id]);
            const vendasTotal = (vendasTotalResult.length && vendasTotalResult[0].values.length && vendasTotalResult[0].values[0][0]) ? vendasTotalResult[0].values[0][0] : 0;
            const produtosBaixoStock = getProdutos().filter(p => p.stock < 5).length;
            const totalUtilizadores = (getQuery("SELECT COUNT(*) FROM utilizadores WHERE loja_id=?", [currentLoja.id])[0]?.values[0][0] || 0);

            let ticketMedio = '0,00';
            if (vendasCount > 0) {

                data: new Date(v[3]).toLocaleString('pt-BR')
            })) : [];

                            </div>

                                        <table class="min-w-full">
                                            <thead class="bg-gray-50 sticky top-0">
                                                <tr><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">ID</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Atendente</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Total</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Data</th><th class="px-4 py-2 text-center text-xs font-medium text-gray-500">Recibo</th></tr>

                                </div>
                                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                                    <i class="fas fa-users w-8 text-blue-600"></i>
                                    <div class="ml-3"><p class="text-sm text-gray-500">Total Utilizadores</p><p class="font-medium text-gray-800">${totalUtilizadores} utilizadores</p></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-lg p-6 text-white">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                            <div><i class="fas fa-calendar-alt text-3xl mb-2 block"></i><p class="text-sm opacity-90">Status da Licenca</p><p class="text-xl font-bold">${subStatus.message}</p></div>
                            <div><i class="fas fa-box-open text-3xl mb-2 block"></i><p class="text-sm opacity-90">Produtos no Sistema</p><p class="text-xl font-bold">${totalProdutos}</p></div>
                            <div><i class="fas fa-chart-simple text-3xl mb-2 block"></i><p class="text-sm opacity-90">Ticket Medio</p><p class="text-xl font-bold">${ticketMedioFormatado} MT</p></div>
                        </div>
                    </div>
                </div>
            `;

            const buscaInput = document.getElementById('buscarVenda');
            if (buscaInput) {
                buscaInput.addEventListener('input', (e) => {
                    const termo = e.target.value.toLowerCase();
                    const linhas = document.querySelectorAll('#vendasTableBody tr');
                    linhas.forEach(linha => {
                        const id = linha.getAttribute('data-id') || '';
                        const atendente = linha.getAttribute('data-atendente') || '';
                        const total = linha.getAttribute('data-total') || '';
                        if (id.includes(termo) || atendente.includes(termo) || total.includes(termo)) {
                            linha.style.display = '';
                        } else {
                            linha.style.display = 'none';
                        }
                    });
                });
            }

            document.querySelectorAll('.reimprimirRecibo').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    var vendaId = parseInt(btn.dataset.id);

                    // Buscar dados da venda
                    var vendaResult = db.exec("SELECT id, total, valor_pago, troco, metodo FROM vendas WHERE id = " + vendaId);

                    if (vendaResult.length > 0 && vendaResult[0].values.length > 0) {
                        var v = vendaResult[0].values[0];
                        var metodoVenda = v[4] || 'dinheiro';

                        // Buscar itens da venda
                        var itensResult = db.exec("SELECT quantidade, preco_unitario, iva, produto_id FROM itens_venda WHERE venda_id = " + vendaId);

                        var itensLista = [];
                        if (itensResult.length > 0 && itensResult[0].values.length > 0) {
                            for (var i = 0; i < itensResult[0].values.length; i++) {
                                var item = itensResult[0].values[i];
                                // Buscar nome do produto
                                var produtoResult = db.exec("SELECT nome FROM produtos WHERE id = " + item[3]);
                                var nomeProduto = 'Produto';
                                if (produtoResult.length > 0 && produtoResult[0].values.length > 0) {
                                    nomeProduto = produtoResult[0].values[0][0];
                                }

                                itensLista.push({
                                    nome: nomeProduto,
                                    quantidade: item[0],
                                    preco: item[1],
                                    iva: item[2]
                                });
                            }
                        }

                        if (itensLista.length > 0) {
                            var carrinhoAntigo = currentCart;
                            currentCart = itensLista;
                            gerarRecibo(v[0], v[1], v[2], v[3], metodoVenda);
                            currentCart = carrinhoAntigo;
                            showToast('Recibo gerado com sucesso!');
                        } else {
                            showAlert('Erro: Nenhum item encontrado para esta venda.', 'error');
                        }
                    } else {
                        showAlert('Erro: Venda nao encontrada. ID: ' + vendaId, 'error');
                    }
                });
            });

            function animarContagem(elementoId, valorFinal, isMoeda = false) {
                const elemento = document.getElementById(elementoId);
                if (!elemento) return;
                let valorAtual = 0;
                const duracao = 1500;
                const passo = 20;
                const incremento = valorFinal / (duracao / passo);
                const intervalo = setInterval(() => {
                    valorAtual += incremento;
                    if (valorAtual >= valorFinal) {
                        valorAtual = valorFinal;
                        elemento.innerHTML = isMoeda ? formatarNumero(valorFinal) : Math.floor(valorAtual);
                        clearInterval(intervalo);
                    } else {
                        elemento.innerHTML = isMoeda ? formatarNumero(valorAtual) : Math.floor(valorAtual);
                    }
                }, passo);
            }

            setTimeout(() => {
                animarContagem('countTotalProdutos', totalProdutos, false);
                animarContagem('countVendasCount', vendasCount, false);
                animarContagem('countVendasTotal', vendasTotal, true);
                animarContagem('countStockBaixo', produtosBaixoStock, false);
            }, 100);

                const troco = pago - total;
                const trocoSpan = document.getElementById('trocoValor');

                    trocoSpan.innerText = troco >= 0 ? troco.toFixed(2) : '0.00';
                    trocoSpan.style.color = troco >= 0 ? '#16a34a' : '#dc2626';

            function buscarProdutoPorCodigo(termo) {
                if (!termo || termo.trim() === '') return false;
                const produto = produtos.find(p =>
                    p.codigo_barras === termo.trim() ||
                    p.nome.toLowerCase().includes(termo.toLowerCase())
                );
                if (!produto) {
                    showAlert(`Produto não encontrado: "${termo}"`, 'error');
                    searchInput.value = '';
                    return false;
                }
                if (produto.stock <= 0) {
                    showAlert(`Produto sem stock: ${produto.nome}`, 'error');
                    searchInput.value = '';
                    return false;
                }
                const usadoNoCarrinho = currentCart.filter(i => i.id === produto.id).reduce((sum, i) => sum + i.quantidade, 0);
                const disponivel = produto.stock - usadoNoCarrinho;
                if (disponivel <= 0) {
                    showAlert(`Stock insuficiente! Disponível: ${disponivel}`, 'error');
                    searchInput.value = '';
                    return false;
                }
                const existente = currentCart.find(i => i.id === produto.id);
                if (existente) {
                    existente.quantidade++;
                    showToast(`${produto.nome} +1 (${existente.quantidade} no carrinho)`, 'success');
                } else {
                    currentCart.push({ ...produto, quantidade: 1 });
                    showToast(`${produto.nome} adicionado!`, 'success');
                }
                renderCart();
                searchInput.value = '';
                return true;
            }

                if (e.key === 'Enter') {

                tables.forEach(t => {

                });

                        showModal('Restaurar', 'Isso substituirá todos os dados. Confirmar?', async () => {

                            newDb.run(`CREATE TABLE produtos (id INTEGER PRIMARY KEY AUTOINCREMENT, codigo_barras TEXT, nome TEXT, preco REAL, iva INTEGER, stock INTEGER)`);
                            newDb.run(`CREATE TABLE vendas (id INTEGER PRIMARY KEY AUTOINCREMENT, utilizador_id INTEGER, total REAL, valor_pago REAL, troco REAL, data TEXT)`);
                            newDb.run(`CREATE TABLE itens_venda (id INTEGER PRIMARY KEY AUTOINCREMENT, venda_id INTEGER, produto_id INTEGER, quantidade INTEGER, preco_unitario REAL, iva INTEGER)`);
                            newDb.run(`CREATE TABLE assinatura (id INTEGER PRIMARY KEY AUTOINCREMENT, loja_id INTEGER, inicio_trial TEXT, fim_trial TEXT, ativo INTEGER, pagamento_mensal INTEGER, inicio_pagamento TEXT, fim_pagamento TEXT)`);

                            const tableColumns = {
                                loja: ['id', 'nome', 'endereco', 'contacto'],
                                utilizadores: ['id', 'loja_id', 'nome', 'username', 'password', 'perfil'],
                                produtos: ['id', 'codigo_barras', 'nome', 'preco', 'iva', 'stock'],
                                vendas: ['id', 'utilizador_id', 'total', 'valor_pago', 'troco', 'data'],
                                itens_venda: ['id', 'venda_id', 'produto_id', 'quantidade', 'preco_unitario', 'iva'],
                                assinatura: ['id', 'loja_id', 'inicio_trial', 'fim_trial', 'ativo', 'pagamento_mensal', 'inicio_pagamento', 'fim_pagamento']
                            };

                            for (const [table, rows] of Object.entries(data)) {
                                const columns = tableColumns[table];
                                if (!columns) continue;
                                const placeholders = columns.map(() => '?').join(',');
                                const columnsStr = columns.join(',');
                                for (const row of rows) {
                                    const values = columns.map((_, idx) => row[idx] !== undefined ? row[idx] : null);
                                    newDb.run(`INSERT INTO ${table} (${columnsStr}) VALUES (${placeholders})`, values);
                                }
                            }
                            db = newDb;
                            saveToLocalStorage();
                            showToast('Restaurado!');
                            renderLogin();
                        }, 'Restaurar');
                    } catch (err) {
                        showAlert('Arquivo invalido');
                    }
                };
                reader.readAsText(file);
            };
            addBackToTopButton();
        }

        // ===================== RELATÓRIO PDF =====================
        function gerarRelatorioPDF() {
            const {
                jsPDF
            } = window.jspdf;
            const doc = new jsPDF();

            const vendas = getQuery(`SELECT v.id, u.nome, v.total, v.data FROM vendas v JOIN utilizadores u ON v.utilizador_id = u.id WHERE u.loja_id = ? ORDER BY v.id DESC`, [currentLoja.id]);

            const totalVendas = vendas.length && vendas[0].values.length ? vendas[0].values.length : 0;
            let faturamento = 0;
            if (vendas.length && vendas[0].values.length) {
                vendas[0].values.forEach(v => {
                    faturamento += v[2];
                });
            }

            const hoje = new Date().toLocaleString('pt-BR');
            const ticketMedio = totalVendas > 0 ? (faturamento / totalVendas).toFixed(2) : '0,00';
            const totalProdutos = getProdutos().length;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("RELATÓRIO", 105, 20, {
                align: "center"
            });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text(currentLoja.nome, 105, 30, {
                align: "center"
            });

            doc.setFontSize(9);
            doc.text(`Data de geração: ${hoje}`, 14, 45);
            doc.text(`Gerado por: ${currentUser.nome}`, 14, 53);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("RESUMO GERAL", 14, 68);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.text(`Total de Vendas:`, 20, 80);
            doc.text(`${totalVendas}`, 70, 80);
            doc.text(`Faturamento Total:`, 20, 88);
            doc.text(`${faturamento.toFixed(2).replace('.', ',')} MT`, 70, 88);
            doc.text(`Ticket Medio:`, 20, 96);
            doc.text(`${ticketMedio.replace('.', ',')} MT`, 70, 96);
            doc.text(`Total de Produtos:`, 20, 104);
            doc.text(`${totalProdutos}`, 70, 104);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("LISTA DE VENDAS", 14, 120);

            let y = 132;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.text("ID", 14, y);
            doc.text("DATA / HORA", 35, y);
            doc.text("ATENDENTE", 80, y);
            doc.text("TOTAL (MT)", 150, y);
            y += 5;
            doc.setFont("helvetica", "normal");

            if (vendas.length && vendas[0].values.length) {
                for (let i = 0; i < vendas[0].values.length; i++) {
                    const v = vendas[0].values[i];
                    const dataStr = new Date(v[3]).toLocaleString('pt-BR');
                    doc.text(`#${v[0]}`, 14, y);
                    doc.text(dataStr.substring(0, 16), 35, y);
                    doc.text(v[1].substring(0, 25), 80, y);
                    doc.text(`${v[2].toFixed(2).replace('.', ',')}`, 150, y);
                    y += 5;
                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                        doc.setFont("helvetica", "bold");
                        doc.text("ID", 14, y);
                        doc.text("DATA / HORA", 35, y);
                        doc.text("ATENDENTE", 80, y);
                        doc.text("TOTAL (MT)", 150, y);
                        y += 5;
                        doc.setFont("helvetica", "normal");
                    }
                }
            } else {
                doc.text("Nenhuma venda registrada", 14, y);
            }

            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.text("LUT POS v1.0.0 - Relatório gerado automaticamente", 105, 285, {
                align: "center"
            });

            const nomeArquivo = `relatorio_${currentLoja.nome.replace(/[^a-zA-Z0-9]/g, '_')}_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.pdf`;
            doc.save(nomeArquivo);
        }

        // ===================== LIMPAR VENDAS =====================
        function limparVendas() {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4';
            modalDiv.innerHTML = `
        <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center">
            <i class="fas fa-exclamation-triangle text-red-500 text-5xl mb-4"></i>
            <p class="text-gray-700 mb-2"><strong>Atenção!</strong></p>
            <p class="text-gray-600 mb-4">Isso vai apagar TODO o histórico de vendas.</p>
            <p class="text-gray-600 text-sm">Produtos serão mantidos.</p>
            <p class="text-gray-600 text-sm">Loja será mantida.</p>
            <p class="text-gray-600 text-sm mb-4">Utilizadores serão mantidos.</p>
            <div class="flex gap-3 justify-center">
                <button id="cancelBtn" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">Cancelar</button>
                <button id="confirmBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">SIM, APAGAR</button>
            </div>
        </div>
    `;
            document.body.appendChild(modalDiv);

            document.getElementById('cancelBtn').onclick = () => modalDiv.remove();

            document.getElementById('confirmBtn').onclick = async () => {
                modalDiv.remove();
                db.run("DELETE FROM vendas");
                db.run("DELETE FROM itens_venda");
                saveToLocalStorage();
                showAlert('Histórico de vendas apagado com sucesso!', 'success');
                renderDashboard();
            };
        }

        window.editarLoja = editarLoja;

        async function start() {
            const loader = document.getElementById('loader');
            const progressBar = document.querySelector('.loader-progress-bar');

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 10;
                if (progressBar) progressBar.style.width = Math.min(progress, 90) + '%';
                if (progress >= 90) clearInterval(progressInterval);
            }, 100);

            try {
                await initDatabase();

                if (loadSession()) {
                    try {
                        const userCheck = getQuery("SELECT * FROM utilizadores WHERE id=?", [currentUser.id]);
                        if (userCheck.length && userCheck[0].values && userCheck[0].values.length) {
                            const loja = getQuery("SELECT * FROM loja WHERE id=?", [currentUser.loja_id]);
                            if (loja.length && loja[0].values && loja[0].values.length) {
                                const l = loja[0].values[0];
                                currentLoja = {
                                    id: l[0],
                                    nome: l[1],
                                    endereco: l[2],
                                    contacto: l[3]
                                };
                            }
                            if (progressBar) progressBar.style.width = '100%';
                            setTimeout(() => {
                                loader.classList.add('hide');
                                setTimeout(() => {
                                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                                }, 400);
                            }, 300);
                            renderDashboard();
                            return;
                        } else {
                            clearSession();
                        }
                    } catch (e) {
                        clearSession();
                    }
                }

                if (progressBar) progressBar.style.width = '100%';
                setTimeout(() => {
                    loader.classList.add('hide');
                    setTimeout(() => {
                        if (loader.parentNode) loader.parentNode.removeChild(loader);
                    }, 400);
                }, 300);

                renderLogin();

            } catch (error) {
                console.error('Erro ao iniciar:', error);
                if (progressBar) progressBar.style.width = '100%';
                setTimeout(() => {
                    loader.classList.add('hide');
                    setTimeout(() => {
                        if (loader.parentNode) loader.parentNode.removeChild(loader);
                    }, 400);
                }, 300);
                renderLogin();
            }
        }

        start();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>

    <script>
        // Forçar modo imersivo no Android
        if (/Android|wv|; wv\)/i.test(navigator.userAgent)) {
            // Entrar em fullscreen
            document.documentElement.requestFullscreen();

            // Esconder barra de navegação e endereço
            window.addEventListener('load', function () {
                setTimeout(function () {
                    window.scrollTo(0, 1);
                    // Tenta novamente após 1 segundo
                    setTimeout(function () {
                        document.documentElement.requestFullscreen();
                    }, 1000);
                }, 500);
            });

            // Impedir que o teclado mostre a barra
            document.addEventListener('focusin', function () {
                window.scrollTo(0, 1);
            });
        }
    </script>
